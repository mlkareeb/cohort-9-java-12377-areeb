sonar.projectKey=mlkareeb_cohort-9-java-12377-areeb
sonar.organization=mlkareeb

# --- SOURCE DIRECTORIES ---
# Both backend Java and frontend JS scanned together in one run from repo root
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test,frontend/src

# --- EXCLUSIONS ---
# Frontend test files are excluded from source analysis (they're classified as tests instead, below)
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.spec.js
sonar.test.inclusions=backend/src/test/**/*.java,frontend/src/**/*.test.js,frontend/src/**/*.spec.js

# --- JAVA BYTECODE (compiled by "mvn verify" which runs before this scan in build.yml) ---
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=/home/runner/.m2/repository/**/*.jar

# --- ENCODING ---
sonar.sourceEncoding=UTF-8